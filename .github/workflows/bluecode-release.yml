name: BlueCode Release

# BlueCode has one channel, stable. Every push to main publishes the next
# version as a GitHub Release; installed desktop apps update from it. See
# docs/operations/bluecode-release.md.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, in push order. A burst of pushes folds into the run
# already building plus one pending run for the newest commit.
concurrency:
  group: bluecode-release
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      previous_tag: ${{ steps.next.outputs.previous_tag }}
    steps:
      # Upstream's other workflows stay in the tree so merges from T3 Code never
      # conflict on them, but they deploy upstream's services and target runners
      # this repository does not have. A merge can add a new one; turn it off here.
      - name: Disable upstream-only workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: ci.yml release-desktop.yml bluecode-release.yml
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/workflows?per_page=100" --paginate \
            --jq '.workflows[] | select(.state == "active" and (.path | startswith(".github/workflows/"))) | .path' |
            while read -r path; do
              name="${path##*/}"
              case " $KEEP " in *" $name "*) continue ;; esac
              echo "Disabling $name"
              gh workflow disable "$name"
            done

      # The patch number after the newest published release. Counting from the
      # release rather than the run number survives renaming this workflow, and
      # the concurrency group means no other run publishes in between.
      - name: Resolve next version
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          previous="$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName \
            --jq '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(ltrimstr("v") | split(".") | map(tonumber)) | last // ""')"
          if [[ -z "$previous" ]]; then
            version="1.0.0"
          else
            IFS=. read -r major minor patch <<< "${previous#v}"
            version="$major.$minor.$((patch + 1))"
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "previous_tag=$previous"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v$version (previous: ${previous:-none})" >> "$GITHUB_STEP_SUMMARY"

  bundle:
    name: Build JS bundle
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.version.outputs.version }}"

      # No Clerk or relay values: BlueCode ships without upstream's T3 Connect.
      - name: Build JS bundle
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: vp run build:desktop:bundle

      # Two paths under apps/ so the artifact root is apps/; consumers download
      # into `apps` to restore both at their original locations.
      - name: Upload JS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  desktop_mac_arm64:
    name: Desktop macOS arm64
    needs: [version, bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: stable
      relay_client_tracing: false
      label: macOS arm64
      runner: macos-26
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: true
      launch_check: true
      # desktop_mac_x64 saves the shared pnpm store.
      save_pnpm_store: false

  desktop_mac_x64:
    name: Desktop macOS x64
    needs: [version, bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: stable
      relay_client_tracing: false
      label: macOS x64
      runner: macos-26
      platform: mac
      target: dmg
      arch: x64
      rust_target: x86_64-apple-darwin
      resource_key: darwin-x64
      # Node single-executables are unsupported on x64 macOS (see upstream's release.yml).
      cli_archive: false

  # Only the CLI archive from this job is published: SSH environments install
  # it on Linux hosts. The desktop package is built and opened as a check that
  # the app still packages off macOS.
  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [version, bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: stable
      relay_client_tracing: false
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      launch_check: true

  release:
    name: Publish GitHub Release
    needs: [version, desktop_mac_arm64, desktop_mac_x64, desktop_linux_x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...

      - name: Download macOS desktop artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-mac-*
          merge-multiple: true
          path: release-assets

      - name: Download CLI archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      # Installers verify archives against this file.
      - name: Write CLI archive checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum t3-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # electron-updater reads one macOS manifest and picks the file whose name
      # carries the running arch, so the x64 entries join the arm64 manifest.
      - name: Merge macOS updater manifests
        run: |
          set -euo pipefail
          node scripts/merge-update-manifests.ts --platform mac \
            release-assets/latest-mac.yml release-assets/latest-mac-x64.yml
          rm release-assets/latest-mac-x64.yml
          cat release-assets/latest-mac.yml

      # Created as a draft so the updater feed never points at a release whose
      # files are still uploading; publishing it creates the tag.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.version.outputs.previous_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.blockmap
            release-assets/latest-mac.yml
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
          )
          notes=(--generate-notes)
          if [[ -n "$PREVIOUS_TAG" ]]; then
            notes+=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          gh release create "$TAG" "${files[@]}" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "BlueCode $TAG" \
            "${notes[@]}"
          gh release edit "$TAG" --draft=false --latest
          echo "Published https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
